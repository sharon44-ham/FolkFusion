<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Style — FolkFusion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #FDF6EC;
      color: #3B1F0A;
      min-height: 100vh;
      padding: 40px 20px;
    }
    nav {
      text-align: center;
      margin-bottom: 32px;
    }
    nav a {
      color: #C0392B;
      text-decoration: none;
      font-size: 0.95rem;
    }
    nav a:hover { text-decoration: underline; }
    h1 {
      text-align: center;
      font-size: 2rem;
      color: #C0392B;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #7D5A3C;
      margin-bottom: 36px;
    }
    .layout {
      display: flex;
      gap: 40px;
      max-width: 960px;
      margin: 0 auto;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview img {
      max-width: 420px;
      width: 100%;
      border-radius: 12px;
      border: 3px solid #E8C46A;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .style-panel { flex: 1; min-width: 220px; }
    .style-panel h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #7D5A3C;
    }
    .style-btn {
      display: block;
      width: 100%;
      background: #fff;
      border: 2px solid #E8C46A;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: #3B1F0A;
      transition: all 0.2s;
      text-decoration: none;
    }
    .style-btn:hover {
      background: #C0392B;
      border-color: #C0392B;
      color: white;
    }
    .style-btn strong { display: block; font-size: 1rem; }
    .style-btn span { font-size: 0.82rem; opacity: 0.75; }
    .style-btn:hover span { opacity: 0.9; }
  </style>
</head>
<body>
  <nav><a href="/">&#8592; Upload a different image</a></nav>
  <h1>🎨 FolkFusion</h1>
  <p class="subtitle">Choose a traditional art form to revive</p>

  <div class="layout">
    <div class="preview">
      <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Your uploaded image">
    </div>
    <div class="style-panel">
      <h2>Choose a style:</h2>
      {% for key, info in styles.items() %}
      <a class="style-btn" href="{{ url_for('convert', filename=filename, style=key) }}">
        <strong>{{ info.label }}</strong>
        <span>{{ info.desc }} &middot; {{ info.origin }}</span>
      </a>
      {% endfor %}
    </div>
  </div>
</body>
</html>
