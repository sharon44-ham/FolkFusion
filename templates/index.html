<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FolkFusion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #FDF6EC;
      color: #3B1F0A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    header { text-align: center; margin-bottom: 48px; }
    header h1 {
      font-size: 3rem;
      color: #C0392B;
      letter-spacing: 2px;
    }
    header p {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #7D5A3C;
    }
    .upload-card {
      background: #fff;
      border: 2px dashed #E8C46A;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .upload-card label {
      display: block;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .upload-card label span {
      display: block;
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .upload-card label p {
      font-size: 1rem;
      color: #7D5A3C;
    }
    #file-input { display: none; }
    #file-name {
      font-size: 0.9rem;
      color: #999;
      margin-bottom: 20px;
      min-height: 20px;
    }
    .btn {
      display: inline-block;
      background: #C0392B;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn:hover { background: #A93226; }
    .flash {
      background: #FDEDEC;
      border: 1px solid #E74C3C;
      color: #922B21;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .styles-preview {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 40px;
    }
    .style-tag {
      background: #FDF3E3;
      border: 1px solid #E8C46A;
      color: #7D5A3C;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 FolkFusion</h1>
    <p>Bridging the present with India's timeless folk art traditions</p>
  </header>

  <div class="upload-card">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/upload" method="POST" enctype="multipart/form-data">
      <label for="file-input">
        <span>&#128444;</span>
        <p>Click to choose an image</p>
      </label>
      <input type="file" id="file-input" name="image" accept="image/*" required
             onchange="document.getElementById('file-name').textContent = this.files[0]?.name || ''">
      <div id="file-name"></div>
      <button type="submit" class="btn">Upload &amp; Style</button>
    </form>
  </div>

  <div class="styles-preview">
    <span class="style-tag">Warli</span>
    <span class="style-tag">Madhubani</span>
    <span class="style-tag">Pattachitra</span>
    <span class="style-tag">Gond</span>
    <span class="style-tag">Kalamkari</span>
  </div>

  <script>
    const dropArea = document.querySelector('.upload-card');
    dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.borderColor = '#C0392B'; });
    dropArea.addEventListener('dragleave', () => { dropArea.style.borderColor = '#E8C46A'; });
    dropArea.addEventListener('drop', e => {
      e.preventDefault();
      dropArea.style.borderColor = '#E8C46A';
      const input = document.getElementById('file-input');
      input.files = e.dataTransfer.files;
      document.getElementById('file-name').textContent = input.files[0]?.name || '';
    });
  </script>
</body>
</html>
